<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turkey MapTap - Find cities on map</title>
    <style>
        * { user-select: none; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a472a, #0e2a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .game {
            background: #f5f2e8;
            border-radius: 30px;
            padding: 20px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .score-box {
            background: #2c2b28;
            padding: 8px 20px;
            border-radius: 50px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .target {
            background: #3b2a1f;
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-size: 1.3rem;
        }
        .city-name {
            color: #ffaa33;
            font-weight: bold;
            font-size: 1.8rem;
        }
        .map-container {
            position: relative;
            margin: 15px 0;
            text-align: center;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: crosshair;
            /* Maintain exact 1024x500 proportions - NO SQUISHING */
            width: 100%;
            height: auto;
            max-width: 1024px;
            background: #87CEEB;
        }
        .message {
            background: #2c2b28;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .perfect { background: #2f6b3c; color: white; }
        .good { background: #6b8c3c; color: white; }
        .close { background: #c9a13b; color: white; }
        .far { background: #8b6c3c; color: white; }
        .miss { background: #8b3c2c; color: white; }
        button {
            background: #d9a13b;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
        }
        button:active { transform: scale(0.98); }
        .feedback { font-size: 0.9rem; margin-top: 8px; text-align: center; }
        @media (max-width: 700px) {
            .city-name { font-size: 1.3rem; }
            .target { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="game">
    <div class="header">
        <div class="score-box">🏆 SCORE: <span id="score">0</span></div>
        <div class="target">🎯 FIND: <span class="city-name" id="targetCity">Loading...</span></div>
    </div>
    
    <div class="map-container">
        <canvas id="turkeyCanvas" width="1024" height="500"></canvas>
    </div>
    
    <div class="message" id="message">📍 TAP ON THE MAP where you think the city is located</div>
    <div class="feedback" id="feedback"></div>
    <button id="nextBtn">🎲 NEXT CITY</button>
</div>

<script>
    const canvas = document.getElementById('turkeyCanvas');
    const ctx = canvas.getContext('2d');
    
    // FIXED: Force exact 1024x500 dimensions (no CSS scaling distortion)
    canvas.width = 1024;
    canvas.height = 500;
    
    // Load the map image
    const mapImage = new Image();
    mapImage.src = 'turkey-map.png';
    
    // City coordinates for 1024x500 map
    const cities = [
        { name: "Istanbul", x: 340, y: 165 },
        { name: "Ankara", x: 485, y: 210 },
        { name: "Izmir", x: 280, y: 260 },
        { name: "Bursa", x: 375, y: 195 },
        { name: "Antalya", x: 525, y: 335 },
        { name: "Adana", x: 610, y: 325 },
        { name: "Gaziantep", x: 670, y: 315 },
        { name: "Konya", x: 500, y: 275 },
        { name: "Trabzon", x: 725, y: 165 },
        { name: "Diyarbakır", x: 745, y: 310 },
        { name: "Mersin", x: 580, y: 345 },
        { name: "Kayseri", x: 600, y: 250 },
        { name: "Samsun", x: 650, y: 195 },
        { name: "Erzurum", x: 825, y: 220 },
        { name: "Van", x: 910, y: 290 },
        { name: "Malatya", x: 675, y: 275 },
        { name: "Denizli", x: 395, y: 300 },
        { name: "Şanlıurfa", x: 740, y: 335 },
        { name: "Eskişehir", x: 440, y: 215 },
        { name: "Edirne", x: 230, y: 150 }
    ];
    
    let currentCity = null;
    let score = 0;
    let canTap = true;
    let usedCities = [];
    let mapLoaded = false;
    
    function drawMap(highlightX = null, highlightY = null) {
        if (!mapLoaded) return;
        
        ctx.clearRect(0, 0, 1024, 500);
        ctx.drawImage(mapImage, 0, 0, 1024, 500);
        
        // Draw city dots
        for (let city of cities) {
            ctx.beginPath();
            ctx.arc(city.x, city.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#2c2b28";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(city.x, city.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#ffaa33";
            ctx.fill();
            
            ctx.font = "bold 12px Arial";
            ctx.fillStyle = "#1a1a1a";
            ctx.shadowBlur = 3;
            ctx.shadowColor = "white";
            ctx.fillText(city.name, city.x + 8, city.y - 5);
            ctx.shadowBlur = 0;
        }
        
        // Highlight target city
        if (currentCity) {
            ctx.beginPath();
            ctx.arc(currentCity.x, currentCity.y, 16, 0, Math.PI * 2);
            ctx.strokeStyle = "#ff3300";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(currentCity.x, currentCity.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = "#ff6600";
            ctx.fill();
        }
        
        // Show click location
        if (highlightX && highlightY) {
            ctx.beginPath();
            ctx.arc(highlightX, highlightY, 18, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(highlightX, highlightY, 10, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.fill();
        }
    }
    
    mapImage.onload = function() {
        mapLoaded = true;
        drawMap();
    };
    
    mapImage.onerror = function() {
        document.getElementById('message').innerHTML = "⚠️ Map image not found. Make sure turkey-map.png is uploaded.";
        document.getElementById('message').style.background = "#8b3c2c";
    };
    
    function getRandomCity() {
        if (usedCities.length === cities.length) usedCities = [];
        const available = cities.filter(c => !usedCities.includes(c));
        const random = available[Math.floor(Math.random() * available.length)];
        usedCities.push(random);
        return random;
    }
    
    function calculateScore(distanceKm) {
        if (distanceKm < 50) return { points: 100, grade: "perfect", text: "🎯 PERFECT! 100 points!" };
        if (distanceKm < 150) return { points: 70, grade: "good", text: "👍 GOOD! 70 points" };
        if (distanceKm < 300) return { points: 40, grade: "close", text: "📌 CLOSE! 40 points" };
        if (distanceKm < 500) return { points: 20, grade: "far", text: "🔍 FAR! 20 points" };
        return { points: 0, grade: "miss", text: "❌ MISS! 0 points" };
    }
    
    function distanceBetween(x1, y1, x2, y2) {
        const dx = x1 - x2;
        const dy = y1 - y2;
        const pixelDist = Math.sqrt(dx * dx + dy * dy);
        return pixelDist * 7;
    }
    
    function handleCanvasClick(e) {
        if (!canTap || !currentCity || !mapLoaded) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;
        
        const distance = distanceBetween(clickX, clickY, currentCity.x, currentCity.y);
        const result = calculateScore(distance);
        
        score += result.points;
        document.getElementById('score').innerText = score;
        
        const messageDiv = document.getElementById('message');
        messageDiv.className = `message ${result.grade}`;
        messageDiv.innerHTML = `${result.text} (${Math.round(distance)} km from ${currentCity.name})`;
        
        document.getElementById('feedback').innerHTML = `📍 You tapped ${Math.round(distance)} km away`;
        
        drawMap(clickX, clickY);
        
        canTap = false;
        setTimeout(() => {
            canTap = true;
        }, 1500);
    }
    
    function nextCity() {
        if (!canTap) return;
        currentCity = getRandomCity();
        document.getElementById('targetCity').innerText = currentCity.name;
        document.getElementById('message').className = "message";
        document.getElementById('message').innerHTML = "📍 TAP ON THE MAP where you think the city is located";
        document.getElementById('feedback').innerHTML = "";
        drawMap();
        canTap = true;
    }
    
    // Initialize
    currentCity = cities[0];
    document.getElementById('targetCity').innerText = currentCity.name;
    
    canvas.addEventListener('click', handleCanvasClick);
    document.getElementById('nextBtn').addEventListener('click', nextCity);
</script>
</body>
</html>

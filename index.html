<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turkey MapTap - 5 Cities Challenge</title>
    <style>
        * { user-select: none; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a472a, #0e2a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .game {
            background: #f5f2e8;
            border-radius: 30px;
            padding: 20px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .score-box {
            background: #2c2b28;
            padding: 8px 20px;
            border-radius: 50px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .target {
            background: #3b2a1f;
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-size: 1.3rem;
        }
        .city-name {
            color: #ffaa33;
            font-weight: bold;
            font-size: 1.8rem;
        }
        .map-container {
            text-align: center;
            margin: 15px 0;
        }
        canvas {
            display: inline-block;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: crosshair;
            background: #c9b27c;
            max-width: 100%;
            height: auto;
        }
        .message {
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-size: 1.1rem;
            margin: 10px 0;
            font-weight: bold;
            color: white;
        }
        .message-info { background: #3b2a1f; color: white; }
        .perfect { background: #2f6b3c; color: white; }
        .good { background: #6b8c3c; color: white; }
        .close { background: #c9a13b; color: white; }
        .far { background: #8b6c3c; color: white; }
        .miss { background: #8b3c2c; color: white; }
        .game-complete { background: #2f6b3c; color: white; font-size: 1.3rem; }
        .feedback {
            font-size: 0.9rem;
            margin-top: 8px;
            text-align: center;
            background: #e8e0c8;
            padding: 8px;
            border-radius: 30px;
            color: #2c2b28;
        }
        .progress {
            text-align: center;
            font-size: 1rem;
            margin-top: 10px;
            font-weight: bold;
            color: #2c2b28;
            background: #ddd0a8;
            padding: 8px;
            border-radius: 30px;
        }
        .final-score {
            text-align: center;
            font-size: 1.3rem;
            margin-top: 15px;
            padding: 15px;
            background: #2c2b28;
            border-radius: 20px;
            color: #ffd966;
        }
        button {
            background: #d9a13b;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            color: #2c2b28;
        }
        button:active { transform: scale(0.98); }
        
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        
        @media (max-width: 700px) {
            .city-name { font-size: 1.3rem; }
            .target { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="game">
    <div class="header">
        <div class="score-box">🏆 SCORE: <span id="score">0</span> / 1000</div>
        <div class="target">🎯 FIND: <span class="city-name" id="targetCity">Loading...</span></div>
    </div>
    
    <div class="map-container">
        <canvas id="turkeyCanvas" width="900" height="500"></canvas>
    </div>
    
    <div class="message message-info" id="message">📍 CLICK ON THE MAP where you think the city is located</div>
    <div class="feedback" id="feedback"></div>
    <div class="progress" id="progress">Question 1 of 5</div>
    
    <button id="resetBtn">🔄 PLAY AGAIN</button>
</div>

<canvas id="fireworksCanvas"></canvas>

<script>
    // ========== FIREWORKS SYSTEM ==========
    const fwCanvas = document.getElementById('fireworksCanvas');
    const fwCtx = fwCanvas.getContext('2d');
    let particles = [];
    let fireworksAnimationId = null;
    
    function resizeFwCanvas() {
        fwCanvas.width = window.innerWidth;
        fwCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeFwCanvas);
    resizeFwCanvas();
    
    class Particle {
        constructor(x, y, vx, vy, color, size = 3) {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy;
            this.color = color; this.size = size; this.life = 1; this.decay = 0.02;
            this.gravity = 0.15;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.vy += this.gravity;
            this.life -= this.decay;
            return this.life > 0;
        }
        draw(ctx) {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }
    
    function createFirework(x, y) {
        const colors = ['#ff3300', '#ffaa00', '#ffff00', '#33ff33', '#33ffcc', '#ff33cc', '#ff00ff', '#00aaff'];
        for (let i = 0; i < 80; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 6 + 2;
            const color = colors[Math.floor(Math.random() * colors.length)];
            particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color, Math.random() * 4 + 2));
        }
    }
    
    function createRandomFirework() {
        const x = Math.random() * fwCanvas.width;
        const y = Math.random() * fwCanvas.height * 0.6 + fwCanvas.height * 0.1;
        createFirework(x, y);
    }
    
    function animateFireworks() {
        fwCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
        particles = particles.filter(p => p.update());
        particles.forEach(p => p.draw(fwCtx));
        if (particles.length > 0) {
            fireworksAnimationId = requestAnimationFrame(animateFireworks);
        } else {
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            fireworksAnimationId = null;
        }
    }
    
    function startFireworks(score) {
        let count = 0;
        if (score >= 900) count = 25;
        else if (score >= 800) count = 15;
        else if (score >= 700) count = 10;
        else if (score >= 600) count = 6;
        else return;
        
        if (fireworksAnimationId) {
            cancelAnimationFrame(fireworksAnimationId);
            fireworksAnimationId = null;
        }
        particles = [];
        fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
        
        for (let i = 0; i < count; i++) {
            setTimeout(() => createRandomFirework(), i * 150);
        }
        
        setTimeout(() => {
            if (particles.length > 0 && !fireworksAnimationId) {
                fireworksAnimationId = requestAnimationFrame(animateFireworks);
            }
        }, 100);
        
        setTimeout(() => {
            if (fireworksAnimationId) {
                cancelAnimationFrame(fireworksAnimationId);
                fireworksAnimationId = null;
                particles = [];
                fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            }
        }, 5000);
    }
    
    // ========== MAIN GAME ==========
    const canvas = document.getElementById('turkeyCanvas');
    const ctx = canvas.getContext('2d');
    const width = 900, height = 500;
    canvas.width = width;
    canvas.height = height;
    
    const TURKEY_NORTH = 42.106;
    const TURKEY_SOUTH = 35.813;
    const TURKEY_WEST = 25.666;
    const TURKEY_EAST = 44.818;
    
    function latToY(lat) { return ((TURKEY_NORTH - lat) / (TURKEY_NORTH - TURKEY_SOUTH)) * height; }
    function lonToX(lon) { return ((lon - TURKEY_WEST) / (TURKEY_EAST - TURKEY_WEST)) * width; }
    function pixelToLatLon(x, y) {
        return {
            lon: TURKEY_WEST + (x / width) * (TURKEY_EAST - TURKEY_WEST),
            lat: TURKEY_NORTH - (y / height) * (TURKEY_NORTH - TURKEY_SOUTH)
        };
    }
    
    function haversineDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    
    const allCities = [
        { name: "Adana", lat: 36.9919, lon: 35.3308 }, { name: "Adıyaman", lat: 37.7636, lon: 38.2778 },
        { name: "Afyonkarahisar", lat: 38.7584, lon: 30.5383 }, { name: "Ağrı", lat: 39.7195, lon: 43.0505 },
        { name: "Aksaray", lat: 38.3747, lon: 34.0289 }, { name: "Amasya", lat: 40.6517, lon: 35.8336 },
        { name: "Ankara", lat: 39.9208, lon: 32.8541 }, { name: "Antalya", lat: 36.8969, lon: 30.7133 },
        { name: "Ardahan", lat: 41.1105, lon: 42.7022 }, { name: "Artvin", lat: 41.1825, lon: 41.8189 },
        { name: "Aydın", lat: 37.8416, lon: 27.8456 }, { name: "Balıkesir", lat: 39.6484, lon: 27.8826 },
        { name: "Bartın", lat: 41.6355, lon: 32.3362 }, { name: "Batman", lat: 37.8812, lon: 41.1351 },
        { name: "Bayburt", lat: 40.2554, lon: 40.2231 }, { name: "Bilecik", lat: 40.1431, lon: 29.9794 },
        { name: "Bingöl", lat: 38.8863, lon: 40.4987 }, { name: "Bitlis", lat: 38.4000, lon: 42.1083 },
        { name: "Bolu", lat: 40.7356, lon: 31.6086 }, { name: "Burdur", lat: 37.7203, lon: 30.2908 },
        { name: "Bursa", lat: 40.1826, lon: 29.0665 }, { name: "Çanakkale", lat: 40.1553, lon: 26.4142 },
        { name: "Çankırı", lat: 40.6000, lon: 33.6167 }, { name: "Çorum", lat: 40.5492, lon: 34.9536 },
        { name: "Denizli", lat: 37.7735, lon: 29.0865 }, { name: "Diyarbakır", lat: 37.9144, lon: 40.2306 },
        { name: "Düzce", lat: 40.8389, lon: 31.1656 }, { name: "Edirne", lat: 41.6771, lon: 26.5557 },
        { name: "Elazığ", lat: 38.6811, lon: 39.2256 }, { name: "Erzincan", lat: 39.7464, lon: 39.4925 },
        { name: "Erzurum", lat: 39.9051, lon: 41.2709 }, { name: "Eskişehir", lat: 39.7700, lon: 30.5025 },
        { name: "Gaziantep", lat: 37.0662, lon: 37.3833 }, { name: "Giresun", lat: 40.9128, lon: 38.3894 },
        { name: "Gümüşhane", lat: 40.4603, lon: 39.4769 }, { name: "Hakkâri", lat: 37.5747, lon: 43.7408 },
        { name: "Hatay", lat: 36.4018, lon: 36.3498 }, { name: "Iğdır", lat: 39.9200, lon: 44.0440 },
        { name: "Isparta", lat: 37.7644, lon: 30.5564 }, { name: "İstanbul", lat: 41.0082, lon: 28.9784 },
        { name: "İzmir", lat: 38.4189, lon: 27.1287 }, { name: "Kahramanmaraş", lat: 37.5875, lon: 36.9317 },
        { name: "Karabük", lat: 41.2061, lon: 32.6194 }, { name: "Karaman", lat: 37.1811, lon: 33.2150 },
        { name: "Kars", lat: 40.6017, lon: 43.0975 }, { name: "Kastamonu", lat: 41.3887, lon: 33.7825 },
        { name: "Kayseri", lat: 38.7239, lon: 35.4801 }, { name: "Kilis", lat: 36.7167, lon: 37.1167 },
        { name: "Kırıkkale", lat: 39.8468, lon: 33.5153 }, { name: "Kırklareli", lat: 41.7358, lon: 27.2252 },
        { name: "Kırşehir", lat: 39.1464, lon: 34.1597 }, { name: "Kocaeli", lat: 40.7655, lon: 29.9408 },
        { name: "Konya", lat: 37.8704, lon: 32.5110 }, { name: "Kütahya", lat: 39.4217, lon: 29.9879 },
        { name: "Malatya", lat: 38.3552, lon: 38.3095 }, { name: "Manisa", lat: 38.6133, lon: 27.4250 },
        { name: "Mardin", lat: 37.3132, lon: 40.7351 }, { name: "Mersin", lat: 36.8000, lon: 34.6333 },
        { name: "Muğla", lat: 37.2153, lon: 28.3636 }, { name: "Muş", lat: 38.7347, lon: 41.4911 },
        { name: "Nevşehir", lat: 38.6250, lon: 34.7167 }, { name: "Niğde", lat: 37.9667, lon: 34.6833 },
        { name: "Ordu", lat: 40.9839, lon: 37.8764 }, { name: "Osmaniye", lat: 37.0750, lon: 36.2500 },
        { name: "Rize", lat: 41.0208, lon: 40.5219 }, { name: "Sakarya", lat: 40.7732, lon: 30.3947 },
        { name: "Samsun", lat: 41.2871, lon: 36.3234 }, { name: "Siirt", lat: 37.9311, lon: 41.9453 },
        { name: "Sinop", lat: 42.0239, lon: 35.1531 }, { name: "Sivas", lat: 39.7515, lon: 37.0172 },
        { name: "Şanlıurfa", lat: 37.1591, lon: 38.7969 }, { name: "Şırnak", lat: 37.5163, lon: 42.4610 },
        { name: "Tekirdağ", lat: 40.9789, lon: 27.5106 }, { name: "Tokat", lat: 40.3139, lon: 36.5544 },
        { name: "Trabzon", lat: 41.0061, lon: 39.7191 }, { name: "Tunceli", lat: 39.1075, lon: 39.5489 },
        { name: "Uşak", lat: 38.6775, lon: 29.4058 }, { name: "Van", lat: 38.5012, lon: 43.3730 },
        { name: "Yalova", lat: 40.6550, lon: 29.2775 }, { name: "Yozgat", lat: 39.8200, lon: 34.8094 },
        { name: "Zonguldak", lat: 41.4564, lon: 31.7975 }
    ];
    
    const cities = allCities.map(city => ({
        ...city,
        x: lonToX(city.lon),
        y: latToY(city.lat)
    }));
    
    function drawMap(clickX = null, clickY = null) {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#87CEEB";
        ctx.fillRect(0, 0, width, height);
        
        ctx.beginPath();
        ctx.moveTo(180, 120);
        ctx.bezierCurveTo(220, 100, 320, 90, 420, 95);
        ctx.lineTo(520, 90); ctx.lineTo(620, 100); ctx.lineTo(720, 130);
        ctx.lineTo(760, 180); ctx.lineTo(750, 250); ctx.lineTo(720, 320);
        ctx.lineTo(680, 380); ctx.lineTo(620, 420); ctx.lineTo(550, 450);
        ctx.lineTo(470, 465); ctx.lineTo(390, 460); ctx.lineTo(310, 440);
        ctx.lineTo(250, 400); ctx.lineTo(200, 350); ctx.lineTo(170, 290);
        ctx.lineTo(160, 220); ctx.lineTo(180, 120);
        ctx.fillStyle = "#c9b27c";
        ctx.fill();
        ctx.strokeStyle = "#5c4727";
        ctx.lineWidth = 2;
        ctx.stroke();
        
        if (clickX && clickY) {
            ctx.beginPath();
            ctx.arc(clickX, clickY, 14, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(clickX, clickY, 7, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.fill();
        }
    }
    
    function calculatePoints(distanceKm) {
        if (distanceKm <= 60) return 200;
        if (distanceKm <= 100) return 160;
        if (distanceKm <= 150) return 120;
        if (distanceKm <= 200) return 80;
        if (distanceKm <= 300) return 40;
        return 0;
    }
    
    function getGradeText(distanceKm) {
        if (distanceKm <= 60) return "🎯 PERFECT!";
        if (distanceKm <= 100) return "👍 EXCELLENT!";
        if (distanceKm <= 150) return "✅ VERY GOOD!";
        if (distanceKm <= 200) return "📌 GOOD!";
        if (distanceKm <= 300) return "🔍 NOT BAD";
        return "❌ MISS";
    }
    
    let currentRound = [], currentQuestionIndex = 0, currentCity = null, totalScore = 0;
    let canClick = true, gameActive = true, nextQuestionTimeout = null, hasAnsweredCurrent = false;
    
    function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    function selectRandomCities() { return shuffleArray([...cities]).slice(0, 5); }
    
    function endGame() {
        gameActive = false;
        document.getElementById('message').className = "message game-complete";
        document.getElementById('message').innerHTML = `🎉 GAME COMPLETE! 🎉<br>⭐ Final Score: ${totalScore} / 1000 ⭐`;
        document.getElementById('feedback').innerHTML = "";
        document.getElementById('progress').innerHTML = `🏁 Game finished! Click "PLAY AGAIN" for a new round 🏁`;
        let finalDiv = document.getElementById('finalScore');
        if (!finalDiv) { finalDiv = document.createElement('div'); finalDiv.id = 'finalScore'; finalDiv.className = 'final-score'; document.querySelector('.game').appendChild(finalDiv); }
        finalDiv.innerHTML = `🏆 FINAL SCORE: ${totalScore} / 1000 🏆`;
        startFireworks(totalScore);
    }
    
    function loadNextQuestion() {
        if (currentQuestionIndex >= currentRound.length) { endGame(); return; }
        hasAnsweredCurrent = false;
        currentCity = currentRound[currentQuestionIndex];
        document.getElementById('targetCity').innerText = currentCity.name;
        document.getElementById('progress').innerHTML = `📍 Question ${currentQuestionIndex + 1} of ${currentRound.length}`;
        document.getElementById('message').className = "message message-info";
        document.getElementById('message').innerHTML = "📍 CLICK ON THE MAP where you think the city is located";
        document.getElementById('feedback').innerHTML = "";
        drawMap(); canClick = true;
    }
    
    function handleCanvasClick(e) {
        if (!gameActive || !canClick || !currentCity || hasAnsweredCurrent) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX, clickY = (e.clientY - rect.top) * scaleY;
        const clickLatLon = pixelToLatLon(clickX, clickY);
        const distanceKm = haversineDistance(clickLatLon.lat, clickLatLon.lon, currentCity.lat, currentCity.lon);
        const points = calculatePoints(distanceKm);
        totalScore += points;
        const gradeText = getGradeText(distanceKm);
        document.getElementById('score').innerText = totalScore;
        const messageDiv = document.getElementById('message');
        let gradeClass = "miss";
        if (distanceKm <= 60) gradeClass = "perfect";
        else if (distanceKm <= 100) gradeClass = "perfect";
        else if (distanceKm <= 150) gradeClass = "good";
        else if (distanceKm <= 200) gradeClass = "good";
        else if (distanceKm <= 300) gradeClass = "close";
        messageDiv.className = `message ${gradeClass}`;
        messageDiv.innerHTML = `${gradeText}<br>📍 ${Math.round(distanceKm)} km from ${currentCity.name}<br>⭐ +${points} points!`;
        document.getElementById('feedback').innerHTML = `You clicked ${Math.round(distanceKm)} km away from ${currentCity.name}`;
        drawMap(clickX, clickY);
        hasAnsweredCurrent = true; canClick = false;
        if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
        nextQuestionTimeout = setTimeout(() => { currentQuestionIndex++; loadNextQuestion(); }, 2000);
    }
    
    function resetGame() {
        if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
        gameActive = true; totalScore = 0; currentQuestionIndex = 0; hasAnsweredCurrent = false;
        document.getElementById('score').innerText = "0";
        const finalDiv = document.getElementById('finalScore'); if (finalDiv) finalDiv.remove();
        currentRound = selectRandomCities(); loadNextQuestion();
        if (fireworksAnimationId) { cancelAnimationFrame(fireworksAnimationId); fireworksAnimationId = null; }
        particles = []; fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
    }
    
    drawMap();
    resetGame();
    canvas.addEventListener('click', handleCanvasClick);
    document.getElementById('resetBtn').addEventListener('click', resetGame);
</script>
</body>
</html>

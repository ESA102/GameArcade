<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turkey MapTap - Find the City</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a472a, #0e2a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .game {
            background: #f5f2e8;
            border-radius: 30px;
            padding: 20px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .score-box {
            background: #2c2b28;
            padding: 8px 20px;
            border-radius: 50px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .target {
            background: #3b2a1f;
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-size: 1.3rem;
        }
        .city-name {
            color: #ffaa33;
            font-weight: bold;
            font-size: 1.8rem;
        }
        .map-container {
            text-align: center;
            margin: 15px 0;
        }
        canvas {
            display: inline-block;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: crosshair;
            background: #87CEEB;
            width: auto;
            height: auto;
            max-width: 100%;
        }
        .message {
            background: #2c2b28;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .perfect { background: #2f6b3c; color: white; }
        .good { background: #6b8c3c; color: white; }
        .close { background: #c9a13b; color: white; }
        .far { background: #8b6c3c; color: white; }
        .miss { background: #8b3c2c; color: white; }
        button {
            background: #d9a13b;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
        }
        button:active { transform: scale(0.98); }
        .feedback {
            font-size: 0.9rem;
            margin-top: 8px;
            text-align: center;
        }
        @media (max-width: 700px) {
            .city-name { font-size: 1.3rem; }
            .target { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="game">
    <div class="header">
        <div class="score-box">🏆 SCORE: <span id="score">0</span></div>
        <div class="target">🎯 FIND: <span class="city-name" id="targetCity">Loading...</span></div>
    </div>
    
    <div class="map-container">
        <canvas id="turkeyCanvas" width="1024" height="500"></canvas>
    </div>
    
    <div class="message" id="message">📍 CLICK ON THE MAP where you think the city is located</div>
    <div class="feedback" id="feedback"></div>
    <button id="nextBtn">🎲 NEXT CITY</button>
</div>

<script>
    const canvas = document.getElementById('turkeyCanvas');
    const ctx = canvas.getContext('2d');
    
    // Lock canvas to exact 1024x500 (no distortion)
    canvas.width = 1024;
    canvas.height = 500;
    
    // Load the map
    const mapImage = new Image();
    mapImage.src = 'turkey-map.png';
    
    // City coordinates for 1024x500 map (approximate - you can adjust these)
    const cities = [
        { name: "Istanbul", x: 340, y: 165 },
        { name: "Ankara", x: 485, y: 210 },
        { name: "Izmir", x: 275, y: 260 },
        { name: "Bursa", x: 375, y: 195 },
        { name: "Antalya", x: 520, y: 340 },
        { name: "Adana", x: 610, y: 330 },
        { name: "Gaziantep", x: 670, y: 320 },
        { name: "Konya", x: 495, y: 280 },
        { name: "Trabzon", x: 730, y: 170 },
        { name: "Diyarbakır", x: 750, y: 315 },
        { name: "Mersin", x: 580, y: 350 },
        { name: "Kayseri", x: 600, y: 255 },
        { name: "Samsun", x: 655, y: 200 },
        { name: "Erzurum", x: 830, y: 225 },
        { name: "Van", x: 915, y: 295 },
        { name: "Malatya", x: 680, y: 280 },
        { name: "Denizli", x: 390, y: 305 },
        { name: "Şanlıurfa", x: 745, y: 340 },
        { name: "Eskişehir", x: 440, y: 220 },
        { name: "Edirne", x: 225, y: 150 }
    ];
    
    let currentCity = null;
    let score = 0;
    let canClick = true;
    let usedCities = [];
    let mapLoaded = false;
    
    // Draw ONLY the map and the target city highlight (NO city names visible)
    function drawMap(clickX = null, clickY = null) {
        if (!mapLoaded) return;
        
        ctx.clearRect(0, 0, 1024, 500);
        ctx.drawImage(mapImage, 0, 0, 1024, 500);
        
        // NO city names or dots visible - only the target city hint
        if (currentCity) {
            // Draw a subtle pulsing circle around the target city (so players know WHERE to look?)
            // Actually, for MapTap, you shouldn't show the target at all. 
            // But let's add a small dot that ONLY appears AFTER they click? No.
            // For pure MapTap style: NOTHING visible. Players must know geography.
        }
        
        // Show where the user clicked (feedback)
        if (clickX && clickY) {
            ctx.beginPath();
            ctx.arc(clickX, clickY, 14, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(clickX, clickY, 7, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.fill();
            
            // Draw line to target? No, that would give it away.
        }
    }
    
    mapImage.onload = function() {
        mapLoaded = true;
        drawMap();
    };
    
    mapImage.onerror = function() {
        document.getElementById('message').innerHTML = "⚠️ Map image not found. Please upload turkey-map.png";
        document.getElementById('message').style.background = "#8b3c2c";
    };
    
    function getRandomCity() {
        if (usedCities.length === cities.length) usedCities = [];
        const available = cities.filter(c => !usedCities.includes(c));
        const random = available[Math.floor(Math.random() * available.length)];
        usedCities.push(random);
        return random;
    }
    
    function calculateScore(distancePixels) {
        // Rough conversion: 1 pixel ≈ 5 km in Turkey on a 1024x500 map
        const distanceKm = distancePixels * 5;
        
        if (distanceKm < 30) return { points: 100, grade: "perfect", text: "🎯 PERFECT! 100 points!", km: distanceKm };
        if (distanceKm < 80) return { points: 70, grade: "good", text: "👍 GOOD! 70 points", km: distanceKm };
        if (distanceKm < 150) return { points: 40, grade: "close", text: "📌 CLOSE! 40 points", km: distanceKm };
        if (distanceKm < 250) return { points: 20, grade: "far", text: "🔍 FAR! 20 points", km: distanceKm };
        return { points: 0, grade: "miss", text: "❌ MISS! 0 points", km: distanceKm };
    }
    
    function handleCanvasClick(e) {
        if (!canClick || !currentCity || !mapLoaded) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;
        
        // Calculate distance from click to actual city location
        const dx = clickX - currentCity.x;
        const dy = clickY - currentCity.y;
        const distancePixels = Math.sqrt(dx * dx + dy * dy);
        const result = calculateScore(distancePixels);
        
        // Update score
        score += result.points;
        document.getElementById('score').innerText = score;
        
        // Show result
        const messageDiv = document.getElementById('message');
        messageDiv.className = `message ${result.grade}`;
        messageDiv.innerHTML = `${result.text} (${Math.round(result.km)} km from ${currentCity.name})`;
        
        document.getElementById('feedback').innerHTML = `📍 You clicked ${Math.round(result.km)} km away from ${currentCity.name}`;
        
        // Show where they clicked
        drawMap(clickX, clickY);
        
        // Disable clicking for 1.5 seconds
        canClick = false;
        setTimeout(() => {
            canClick = true;
        }, 1500);
    }
    
    function nextCity() {
        if (!canClick) return;
        
        currentCity = getRandomCity();
        document.getElementById('targetCity').innerText = currentCity.name;
        document.getElementById('message').className = "message";
        document.getElementById('message').innerHTML = "📍 CLICK ON THE MAP where you think the city is located";
        document.getElementById('feedback').innerHTML = "";
        drawMap();
        canClick = true;
    }
    
    // Initialize
    currentCity = cities[0];
    document.getElementById('targetCity').innerText = currentCity.name;
    
    canvas.addEventListener('click', handleCanvasClick);
    document.getElementById('nextBtn').addEventListener('click', nextCity);
</script>
</body>
</html>

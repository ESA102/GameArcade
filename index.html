<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turkey MapTap - Find cities on map</title>
    <style>
        * { user-select: none; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a472a, #0e2a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .game {
            background: #f5f2e8;
            border-radius: 30px;
            padding: 20px;
            max-width: 1000px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .score-box {
            background: #2c2b28;
            padding: 8px 20px;
            border-radius: 50px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .target {
            background: #3b2a1f;
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-size: 1.3rem;
        }
        .city-name {
            color: #ffaa33;
            font-weight: bold;
            font-size: 1.8rem;
        }
        canvas {
            display: block;
            margin: 15px auto;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            background: #87CEEB;
            cursor: crosshair;
            width: 100%;
            height: auto;
        }
        .message {
            background: #2c2b28;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .perfect { background: #2f6b3c; color: white; }
        .good { background: #6b8c3c; color: white; }
        .close { background: #c9a13b; color: white; }
        .far { background: #8b6c3c; color: white; }
        .miss { background: #8b3c2c; color: white; }
        button {
            background: #d9a13b;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
        }
        button:active { transform: scale(0.98); }
        .feedback { font-size: 0.9rem; margin-top: 8px; }
        @media (max-width: 700px) {
            .city-name { font-size: 1.3rem; }
            .target { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="game">
    <div class="header">
        <div class="score-box">🏆 SCORE: <span id="score">0</span></div>
        <div class="target">🎯 FIND: <span class="city-name" id="targetCity">Loading...</span></div>
    </div>
    
    <canvas id="turkeyCanvas" width="900" height="600"></canvas>
    
    <div class="message" id="message">📍 TAP ON THE MAP where you think the city is located</div>
    <div class="feedback" id="feedback"></div>
    <button id="nextBtn">🎲 NEXT CITY</button>
</div>

<script>
    const canvas = document.getElementById('turkeyCanvas');
    const ctx = canvas.getContext('2d');
    const width = 900, height = 600;
    canvas.width = width;
    canvas.height = height;
    
    const cities = [
        { name: "Istanbul", x: 310, y: 210 },
        { name: "Ankara", x: 410, y: 280 },
        { name: "Izmir", x: 260, y: 340 },
        { name: "Bursa", x: 340, y: 250 },
        { name: "Antalya", x: 440, y: 430 },
        { name: "Adana", x: 510, y: 420 },
        { name: "Gaziantep", x: 550, y: 410 },
        { name: "Konya", x: 430, y: 360 },
        { name: "Trabzon", x: 590, y: 220 },
        { name: "Diyarbakır", x: 600, y: 400 },
        { name: "Mersin", x: 480, y: 440 },
        { name: "Kayseri", x: 490, y: 330 },
        { name: "Samsun", x: 520, y: 260 },
        { name: "Erzurum", x: 660, y: 290 },
        { name: "Van", x: 710, y: 380 },
        { name: "Malatya", x: 540, y: 360 },
        { name: "Denizli", x: 340, y: 390 },
        { name: "Şanlıurfa", x: 590, y: 430 },
        { name: "Eskişehir", x: 370, y: 280 },
        { name: "Edirne", x: 220, y: 200 }
    ];
    
    let currentCity = null;
    let score = 0;
    let canTap = true;
    let usedCities = [];
    
    function drawMap(highlightX = null, highlightY = null) {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#87CEEB";
        ctx.fillRect(0, 0, width, height);
        
        ctx.beginPath();
        ctx.moveTo(200, 150);
        ctx.bezierCurveTo(250, 120, 350, 100, 450, 110);
        ctx.lineTo(550, 105);
        ctx.lineTo(650, 120);
        ctx.lineTo(750, 160);
        ctx.lineTo(780, 220);
        ctx.lineTo(770, 300);
        ctx.lineTo(740, 380);
        ctx.lineTo(700, 440);
        ctx.lineTo(640, 480);
        ctx.lineTo(560, 510);
        ctx.lineTo(480, 520);
        ctx.lineTo(400, 510);
        ctx.lineTo(320, 490);
        ctx.lineTo(260, 450);
        ctx.lineTo(210, 400);
        ctx.lineTo(180, 340);
        ctx.lineTo(170, 270);
        ctx.lineTo(180, 200);
        ctx.lineTo(200, 150);
        ctx.fillStyle = "#c9b27c";
        ctx.fill();
        ctx.strokeStyle = "#5c4727";
        ctx.lineWidth = 2;
        ctx.stroke();
        
        for (let city of cities) {
            ctx.beginPath();
            ctx.arc(city.x, city.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#2c2b28";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(city.x, city.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#ffaa33";
            ctx.fill();
            ctx.font = "11px Arial";
            ctx.fillStyle = "#2c2b28";
            ctx.fillText(city.name, city.x + 7, city.y - 5);
        }
        
        if (currentCity) {
            ctx.beginPath();
            ctx.arc(currentCity.x, currentCity.y, 12, 0, Math.PI * 2);
            ctx.strokeStyle = "#ff3300";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(currentCity.x, currentCity.y, 7, 0, Math.PI * 2);
            ctx.fillStyle = "#ff6600";
            ctx.fill();
        }
        
        if (highlightX && highlightY) {
            ctx.beginPath();
            ctx.arc(highlightX, highlightY, 15, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(highlightX, highlightY, 8, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.5)";
            ctx.fill();
        }
    }
    
    function getRandomCity() {
        if (usedCities.length === cities.length) usedCities = [];
        const available = cities.filter(c => !usedCities.includes(c));
        const random = available[Math.floor(Math.random() * available.length)];
        usedCities.push(random);
        return random;
    }
    
    function calculateScore(distanceKm) {
        if (distanceKm < 50) return { points: 100, grade: "perfect", text: "🎯 PERFECT! 100 points!" };
        if (distanceKm < 150) return { points: 70, grade: "good", text: "👍 GOOD! 70 points" };
        if (distanceKm < 300) return { points: 40, grade: "close", text: "📌 CLOSE! 40 points" };
        if (distanceKm < 500) return { points: 20, grade: "far", text: "🔍 FAR! 20 points" };
        return { points: 0, grade: "miss", text: "❌ MISS! 0 points" };
    }
    
    function distanceBetween(x1, y1, x2, y2) {
        const dx = x1 - x2;
        const dy = y1 - y2;
        const pixelDist = Math.sqrt(dx * dx + dy * dy);
        return pixelDist * 7;
    }
    
    function handleCanvasClick(e) {
        if (!canTap || !currentCity) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;
        
        const distance = distanceBetween(clickX, clickY, currentCity.x, currentCity.y);
        const result = calculateScore(distance);
        
        score += result.points;
        document.getElementById('score').innerText = score;
        
        const messageDiv = document.getElementById('message');
        messageDiv.className = `message ${result.grade}`;
        messageDiv.innerHTML = `${result.text} (${Math.round(distance)} km from ${currentCity.name})`;
        
        document.getElementById('feedback').innerHTML = `📍 You tapped ${Math.round(distance)} km away`;
        
        drawMap(clickX, clickY);
        
        canTap = false;
        setTimeout(() => {
            canTap = true;
        }, 1500);
    }
    
    function nextCity() {
        if (!canTap) return;
        currentCity = getRandomCity();
        document.getElementById('targetCity').innerText = currentCity.name;
        document.getElementById('message').className = "message";
        document.getElementById('message').innerHTML = "📍 TAP ON THE MAP where you think the city is located";
        document.getElementById('feedback').innerHTML = "";
        drawMap();
        canTap = true;
    }
    
    currentCity = cities[0];
    document.getElementById('targetCity').innerText = currentCity.name;
    drawMap();
    
    canvas.addEventListener('click', handleCanvasClick);
    document.getElementById('nextBtn').addEventListener('click', nextCity);
</script>
</body>
</html>

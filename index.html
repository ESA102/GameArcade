<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turkey MapTap - Find cities</title>
    <style>
        * { user-select: none; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a472a, #0e2a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .game {
            background: #f5f2e8;
            border-radius: 30px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .score-box {
            background: #2c2b28;
            padding: 8px 20px;
            border-radius: 50px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .target {
            background: #3b2a1f;
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-size: 1.3rem;
        }
        .city-name {
            color: #ffaa33;
            font-weight: bold;
            font-size: 1.8rem;
        }
        .map-wrapper {
            position: relative;
            margin: 15px 0;
            display: flex;
            justify-content: center;
        }
        canvas {
            display: block;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: crosshair;
            max-width: 100%;
            height: auto;
            background: #87CEEB;
        }
        .message {
            background: #2c2b28;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .perfect { background: #2f6b3c; }
        .good { background: #6b8c3c; }
        .close { background: #c9a13b; }
        .far { background: #8b6c3c; }
        .miss { background: #8b3c2c; }
        button {
            background: #d9a13b;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
        }
        button:active { transform: scale(0.98); }
        .feedback { font-size: 0.9rem; margin-top: 8px; text-align: center; }
        .admin-panel {
            background: #2c2b28;
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
            color: white;
        }
        .admin-panel h4 { margin: 0 0 10px 0; color: #ffaa33; }
        .coord-display {
            font-family: monospace;
            font-size: 12px;
            background: #1a1a1a;
            padding: 8px;
            border-radius: 10px;
            margin-top: 8px;
        }
        .mode-toggle {
            background: #d9a13b;
            border: none;
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        @media (max-width: 700px) {
            .city-name { font-size: 1.3rem; }
            .target { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="game">
    <div class="header">
        <div class="score-box">🏆 SCORE: <span id="score">0</span></div>
        <div class="target">🎯 FIND: <span class="city-name" id="targetCity">Loading...</span></div>
    </div>
    
    <div class="map-wrapper">
        <canvas id="turkeyCanvas"></canvas>
    </div>
    
    <div class="message" id="message">📍 TAP ON THE MAP where you think the city is</div>
    <div class="feedback" id="feedback"></div>
    <button id="nextBtn">🎲 NEXT CITY</button>
    
    <!-- Admin panel - click the button to enter city positions -->
    <div class="admin-panel">
        <button class="mode-toggle" id="toggleModeBtn">🔧 SET CITY POSITIONS (ADMIN MODE)</button>
        <div id="adminControls" style="display: none;">
            <p>📌 <strong>Admin Mode:</strong> Select a city from below, then click on the map to set its position.</p>
            <select id="citySelector" style="width: 100%; padding: 8px; border-radius: 10px; margin-bottom: 10px;">
            </select>
            <div class="coord-display" id="coordDisplay">Click a city to see/set its coordinates</div>
            <button id="saveCoordsBtn" style="margin-top: 10px; background: #2f6b3c;">💾 SAVE POSITIONS</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('turkeyCanvas');
    const ctx = canvas.getContext('2d');
    
    // List of cities (no coordinates yet - YOU set them!)
    const cityNames = [
        "Istanbul", "Ankara", "Izmir", "Bursa", "Antalya", "Adana", "Gaziantep",
        "Konya", "Trabzon", "Diyarbakır", "Mersin", "Kayseri", "Samsun", "Erzurum",
        "Van", "Malatya", "Denizli", "Şanlıurfa", "Eskişehir", "Edirne"
    ];
    
    // Load saved coordinates from localStorage, or use defaults
    let cities = [];
    let currentCity = null;
    let score = 0;
    let canTap = true;
    let usedCities = [];
    let mapImage = new Image();
    let mapLoaded = false;
    let imgWidth = 0, imgHeight = 0;
    let adminMode = false;
    
    // Load saved coordinates
    function loadCoordinates() {
        const saved = localStorage.getItem('turkey_city_coords');
        if (saved) {
            return JSON.parse(saved);
        } else {
            // Default approximate positions (will be overwritten by admin)
            return cityNames.map((name, i) => ({
                name: name,
                x: 300 + (i * 30),
                y: 200 + (i * 15)
            }));
        }
    }
    
    cities = loadCoordinates();
    
    // Save coordinates
    function saveCoordinates() {
        localStorage.setItem('turkey_city_coords', JSON.stringify(cities));
        alert('Coordinates saved! Refresh to use them.');
        drawMap();
    }
    
    // Update a city's coordinates
    function updateCityCoords(cityName, x, y) {
        const city = cities.find(c => c.name === cityName);
        if (city) {
            city.x = x;
            city.y = y;
            drawMap();
            updateCoordDisplay();
        }
    }
    
    function updateCoordDisplay() {
        const selector = document.getElementById('citySelector');
        const selectedName = selector?.value;
        if (selectedName) {
            const city = cities.find(c => c.name === selectedName);
            if (city) {
                document.getElementById('coordDisplay').innerHTML = 
                    `📍 ${city.name}: X=${Math.round(city.x)}, Y=${Math.round(city.y)}<br>
                     <small>Click on the map to set new position</small>`;
            }
        }
    }
    
    function resizeCanvas() {
        if (!mapLoaded) return;
        
        const wrapper = document.querySelector('.map-wrapper');
        const maxWidth = wrapper.clientWidth - 20;
        
        const scale = Math.min(1, maxWidth / imgWidth);
        canvas.width = imgWidth;
        canvas.height = imgHeight;
        canvas.style.width = `${imgWidth * scale}px`;
        canvas.style.height = `${imgHeight * scale}px`;
        
        drawMap();
    }
    
    function drawMap(clickX = null, clickY = null) {
        if (!mapLoaded) return;
        
        ctx.clearRect(0, 0, imgWidth, imgHeight);
        ctx.drawImage(mapImage, 0, 0, imgWidth, imgHeight);
        
        // In admin mode, show ALL city markers with names
        if (adminMode) {
            for (let city of cities) {
                ctx.beginPath();
                ctx.arc(city.x, city.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = "#ff6600";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(city.x, city.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.font = "bold 14px Arial";
                ctx.fillStyle = "#ff0000";
                ctx.shadowBlur = 3;
                ctx.shadowColor = "black";
                ctx.fillText(city.name, city.x + 10, city.y - 5);
                ctx.shadowBlur = 0;
            }
        } else {
            // Normal game mode: NO city names visible
            // Only show the target city highlight
            if (currentCity) {
                ctx.beginPath();
                ctx.arc(currentCity.x, currentCity.y, 14, 0, Math.PI * 2);
                ctx.strokeStyle = "#ff3300";
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(currentCity.x, currentCity.y, 7, 0, Math.PI * 2);
                ctx.fillStyle = "#ff6600";
                ctx.fill();
            }
        }
        
        // Show click location
        if (clickX && clickY) {
            ctx.beginPath();
            ctx.arc(clickX, clickY, 16, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(clickX, clickY, 8, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.5)";
            ctx.fill();
        }
    }
    
    mapImage.onload = function() {
        imgWidth = mapImage.width;
        imgHeight = mapImage.height;
        mapLoaded = true;
        
        canvas.width = imgWidth;
        canvas.height = imgHeight;
        
        const wrapper = document.querySelector('.map-wrapper');
        const maxWidth = wrapper.clientWidth - 20;
        const scale = Math.min(1, maxWidth / imgWidth);
        canvas.style.width = `${imgWidth * scale}px`;
        canvas.style.height = `${imgHeight * scale}px`;
        
        drawMap();
        
        window.addEventListener('resize', () => {
            const newScale = Math.min(1, (wrapper.clientWidth - 20) / imgWidth);
            canvas.style.width = `${imgWidth * newScale}px`;
            canvas.style.height = `${imgHeight * newScale}px`;
            drawMap();
        });
    };
    
    mapImage.onerror = function() {
        document.getElementById('message').innerHTML = "⚠️ Map image not found. Make sure turkey-map.png is uploaded.";
        document.getElementById('message').style.background = "#8b3c2c";
    };
    
    mapImage.src = 'turkey-map.png';
    
    function getRandomCity() {
        if (usedCities.length === cities.length) usedCities = [];
        const available = cities.filter(c => !usedCities.includes(c));
        const random = available[Math.floor(Math.random() * available.length)];
        usedCities.push(random);
        return random;
    }
    
    function calculateScore(distancePixels) {
        const distanceKm = distancePixels * 5;
        if (distanceKm < 30) return { points: 100, grade: "perfect", text: "🎯 PERFECT! 100 points!" };
        if (distanceKm < 80) return { points: 70, grade: "good", text: "👍 GOOD! 70 points" };
        if (distanceKm < 150) return { points: 40, grade: "close", text: "📌 CLOSE! 40 points" };
        if (distanceKm < 250) return { points: 20, grade: "far", text: "🔍 FAR! 20 points" };
        return { points: 0, grade: "miss", text: "❌ MISS! 0 points" };
    }
    
    function handleCanvasClick(e) {
        if (!mapLoaded) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;
        
        // Admin mode: set coordinates for selected city
        if (adminMode) {
            const selector = document.getElementById('citySelector');
            const selectedName = selector.value;
            if (selectedName) {
                updateCityCoords(selectedName, clickX, clickY);
                document.getElementById('coordDisplay').innerHTML = 
                    `✅ Set ${selectedName} to X=${Math.round(clickX)}, Y=${Math.round(clickY)}`;
            }
            return;
        }
        
        // Normal game mode
        if (!canTap || !currentCity) return;
        
        const dx = clickX - currentCity.x;
        const dy = clickY - currentCity.y;
        const distancePixels = Math.sqrt(dx * dx + dy * dy);
        const result = calculateScore(distancePixels);
        
        score += result.points;
        document.getElementById('score').innerText = score;
        
        const messageDiv = document.getElementById('message');
        messageDiv.className = `message ${result.grade}`;
        const distanceKm = Math.round(distancePixels * 5);
        messageDiv.innerHTML = `${result.text} (${distanceKm} km from ${currentCity.name})`;
        
        document.getElementById('feedback').innerHTML = `📍 You tapped ${distanceKm} km away`;
        
        drawMap(clickX, clickY);
        
        canTap = false;
        setTimeout(() => {
            canTap = true;
        }, 1500);
    }
    
    function nextCity() {
        if (!canTap) return;
        if (adminMode) {
            alert('Exit admin mode first (click the toggle button)');
            return;
        }
        currentCity = getRandomCity();
        document.getElementById('targetCity').innerText = currentCity.name;
        document.getElementById('message').className = "message";
        document.getElementById('message').innerHTML = "📍 TAP ON THE MAP where you think the city is";
        document.getElementById('feedback').innerHTML = "";
        drawMap();
        canTap = true;
    }
    
    function toggleAdminMode() {
        adminMode = !adminMode;
        const controls = document.getElementById('adminControls');
        const toggleBtn = document.getElementById('toggleModeBtn');
        
        if (adminMode) {
            controls.style.display = 'block';
            toggleBtn.innerHTML = '🎮 EXIT ADMIN MODE (PLAY GAME)';
            toggleBtn.style.background = '#8b3c2c';
            document.getElementById('message').innerHTML = "🔧 ADMIN MODE: Click a city, then click the map to set its position";
            // Populate city selector
            const selector = document.getElementById('citySelector');
            selector.innerHTML = '';
            cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city.name;
                option.textContent = city.name;
                selector.appendChild(option);
            });
            updateCoordDisplay();
            selector.onchange = () => updateCoordDisplay();
            drawMap();
        } else {
            controls.style.display = 'none';
            toggleBtn.innerHTML = '🔧 SET CITY POSITIONS (ADMIN MODE)';
            toggleBtn.style.background = '#d9a13b';
            document.getElementById('message').innerHTML = "📍 TAP ON THE MAP where you think the city is";
            drawMap();
        }
    }
    
    // Initialize
    function init() {
        currentCity = cities[0];
        document.getElementById('targetCity').innerText = currentCity.name;
        document.getElementById('toggleModeBtn').addEventListener('click', toggleAdminMode);
        document.getElementById('saveCoordsBtn').addEventListener('click', saveCoordinates);
        canvas.addEventListener('click', handleCanvasClick);
        document.getElementById('nextBtn').addEventListener('click', nextCity);
    }
    
    init();
</script>
</body>
</html>

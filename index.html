<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turkey MapTap - Find cities on map</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a472a, #0e2a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .game {
            background: #f5f2e8;
            border-radius: 30px;
            padding: 20px;
            max-width: 1000px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .score-box {
            background: #2c2b28;
            padding: 8px 20px;
            border-radius: 50px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .target {
            background: #3b2a1f;
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-size: 1.3rem;
        }
        .city-name {
            color: #ffaa33;
            font-weight: bold;
            font-size: 1.8rem;
        }
        .map-container {
            position: relative;
            margin: 15px 0;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: crosshair;
            width: 100%;
            height: auto;
            background: #87CEEB;
        }
        .message {
            background: #2c2b28;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .perfect { background: #2f6b3c; color: white; }
        .good { background: #6b8c3c; color: white; }
        .close { background: #c9a13b; color: white; }
        .far { background: #8b6c3c; color: white; }
        .miss { background: #8b3c2c; color: white; }
        button {
            background: #d9a13b;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
        }
        button:active { transform: scale(0.98); }
        .feedback { font-size: 0.9rem; margin-top: 8px; text-align: center; }
        @media (max-width: 700px) {
            .city-name { font-size: 1.3rem; }
            .target { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="game">
    <div class="header">
        <div class="score-box">🏆 SCORE: <span id="score">0</span></div>
        <div class="target">🎯 FIND: <span class="city-name" id="targetCity">Loading...</span></div>
    </div>
    
    <div class="map-container">
        <canvas id="turkeyCanvas" width="800" height="600"></canvas>
    </div>
    
    <div class="message" id="message">📍 TAP ON THE MAP where you think the city is located</div>
    <div class="feedback" id="feedback"></div>
    <button id="nextBtn">🎲 NEXT CITY</button>
</div>

<script>
    const canvas = document.getElementById('turkeyCanvas');
    const ctx = canvas.getContext('2d');
    const width = 800, height = 600;
    canvas.width = width;
    canvas.height = height;
    
    // Load the real Turkey map image
    const mapImage = new Image();
    mapImage.src = 'turkey-map.png';
    
    // City coordinates (adjusted for 800x600 map image)
    // These are approximate pixel positions on the real Turkey map
    const cities = [
        { name: "Istanbul", x: 260, y: 195 },
        { name: "Ankara", x: 370, y: 250 },
        { name: "Izmir", x: 215, y: 310 },
        { name: "Bursa", x: 305, y: 230 },
        { name: "Antalya", x: 400, y: 400 },
        { name: "Adana", x: 480, y: 390 },
        { name: "Gaziantep", x: 530, y: 380 },
        { name: "Konya", x: 390, y: 330 },
        { name: "Trabzon", x: 570, y: 195 },
        { name: "Diyarbakır", x: 585, y: 370 },
        { name: "Mersin", x: 455, y: 410 },
        { name: "Kayseri", x: 470, y: 300 },
        { name: "Samsun", x: 510, y: 235 },
        { name: "Erzurum", x: 650, y: 265 },
        { name: "Van", x: 710, y: 350 },
        { name: "Malatya", x: 530, y: 330 },
        { name: "Denizli", x: 310, y: 360 },
        { name: "Şanlıurfa", x: 580, y: 400 },
        { name: "Eskişehir", x: 345, y: 255 },
        { name: "Edirne", x: 180, y: 180 }
    ];
    
    let currentCity = null;
    let score = 0;
    let canTap = true;
    let usedCities = [];
    let mapLoaded = false;
    
    // Draw the map and city markers
    function drawMap(highlightX = null, highlightY = null) {
        if (!mapLoaded) return;
        
        ctx.clearRect(0, 0, width, height);
        
        // Draw the real Turkey map image
        ctx.drawImage(mapImage, 0, 0, width, height);
        
        // Draw city dots on top of the map
        for (let city of cities) {
            ctx.beginPath();
            ctx.arc(city.x, city.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#2c2b28";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(city.x, city.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#ffaa33";
            ctx.fill();
            
            // City label
            ctx.font = "bold 12px Arial";
            ctx.fillStyle = "#1a1a1a";
            ctx.shadowBlur = 3;
            ctx.shadowColor = "white";
            ctx.fillText(city.name, city.x + 8, city.y - 5);
            ctx.shadowBlur = 0;
        }
        
        // Highlight the target city with a pulsing circle
        if (currentCity) {
            ctx.beginPath();
            ctx.arc(currentCity.x, currentCity.y, 16, 0, Math.PI * 2);
            ctx.strokeStyle = "#ff3300";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(currentCity.x, currentCity.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = "#ff6600";
            ctx.fill();
        }
        
        // Show where the user clicked
        if (highlightX && highlightY) {
            ctx.beginPath();
            ctx.arc(highlightX, highlightY, 18, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(highlightX, highlightY, 10, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.fill();
        }
    }
    
    mapImage.onload = function() {
        mapLoaded = true;
        drawMap();
    };
    
    mapImage.onerror = function() {
        console.error("Map image failed to load. Make sure turkey-map.png is uploaded.");
        document.getElementById('message').innerHTML = "⚠️ Map image not found. Please upload turkey-map.png to GitHub.";
        document.getElementById('message').style.background = "#8b3c2c";
    };
    
    function getRandomCity() {
        if (usedCities.length === cities.length) usedCities = [];
        const available = cities.filter(c => !usedCities.includes(c));
        const random = available[Math.floor(Math.random() * available.length)];
        usedCities.push(random);
        return random;
    }
    
    function calculateScore(distanceKm) {
        if (distanceKm < 50) return { points: 100, grade: "perfect", text: "🎯 PERFECT! 100 points!" };
        if (distanceKm < 150) return { points: 70, grade: "good", text: "👍 GOOD! 70 points" };
        if (distanceKm < 300) return { points: 40, grade: "close", text: "📌 CLOSE! 40 points" };
        if (distanceKm < 500) return { points: 20, grade: "far", text: "🔍 FAR! 20 points" };
        return { points: 0, grade: "miss", text: "❌ MISS! 0 points" };
    }
    
    function distanceBetween(x1, y1, x2, y2) {
        const dx = x1 - x2;
        const dy = y1 - y2;
        const pixelDist = Math.sqrt(dx * dx + dy * dy);
        return pixelDist * 7;
    }
    
    function handleCanvasClick(e) {
        if (!canTap || !currentCity || !mapLoaded) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;
        
        const distance = distanceBetween(clickX, clickY, currentCity.x, currentCity.y);
        const result = calculateScore(distance);
        
        score += result.points;
        document.getElementById('score').innerText = score;
        
        const messageDiv = document.getElementById('message');
        messageDiv.className = `message ${result.grade}`;
        messageDiv.innerHTML = `${result.text} (${Math.round(distance)} km from ${currentCity.name})`;
        
        document.getElementById('feedback').innerHTML = `📍 You tapped ${Math.round(distance)} km away`;
        
        drawMap(clickX, clickY);
        
        canTap = false;
        setTimeout(() => {
            canTap = true;
        }, 1500);
    }
    
    function nextCity() {
        if (!canTap) return;
        currentCity = getRandomCity();
        document.getElementById('targetCity').innerText = currentCity.name;
        document.getElementById('message').className = "message";
        document.getElementById('message').innerHTML = "📍 TAP ON THE MAP where you think the city is located";
        document.getElementById('feedback').innerHTML = "";
        drawMap();
        canTap = true;
    }
    
    // Initialize
    currentCity = cities[0];
    document.getElementById('targetCity').innerText = currentCity.name;
    
    canvas.addEventListener('click', handleCanvasClick);
    document.getElementById('nextBtn').addEventListener('click', nextCity);
</script>
</body>
</html>

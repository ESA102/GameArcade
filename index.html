<!DOCTYPE html>
<html>
<head>
    <title>Turkey Map - Test</title>
    <style>
        body { background: #1a472a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        canvas { border: 5px solid white; cursor: crosshair; }
    </style>
</head>
<body>
<canvas id="turkeyCanvas" width="1024" height="500"></canvas>

<script>
    const canvas = document.getElementById('turkeyCanvas');
    const ctx = canvas.getContext('2d');
    
    const mapImage = new Image();
    mapImage.src = 'turkey-map.png';
    
    // HARDCODED correct location for ISTANBUL (pixel coordinates)
    const CORRECT_X = 340;
    const CORRECT_Y = 165;
    
    mapImage.onload = function() {
        ctx.drawImage(mapImage, 0, 0, 1024, 500);
    };
    
    mapImage.onerror = function() {
        ctx.fillStyle = "#c9b27c";
        ctx.fillRect(0, 0, 1024, 500);
        ctx.fillStyle = "black";
        ctx.fillText("Map not found, but green dot will still appear at X=340, Y=165", 50, 50);
    };
    
    canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
        
        // Redraw map
        if (mapImage.complete && mapImage.naturalWidth > 0) {
            ctx.drawImage(mapImage, 0, 0, 1024, 500);
        } else {
            ctx.fillStyle = "#c9b27c";
            ctx.fillRect(0, 0, 1024, 500);
        }
        
        // Draw YOUR click (WHITE)
        ctx.beginPath();
        ctx.arc(clickX, clickY, 14, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.font = "bold 12px Arial";
        ctx.fillText("YOU CLICKED HERE", clickX + 10, clickY - 5);
        
        // Draw CORRECT location (GREEN) - HARDCODED
        ctx.beginPath();
        ctx.arc(CORRECT_X, CORRECT_Y, 16, 0, Math.PI * 2);
        ctx.fillStyle = "#33ff33";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(CORRECT_X, CORRECT_Y, 16, 0, Math.PI * 2);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = "#00aa00";
        ctx.font = "bold 12px Arial";
        ctx.fillText("✅ CORRECT: Istanbul", CORRECT_X + 12, CORRECT_Y - 8);
        
        // Draw line
        ctx.beginPath();
        ctx.moveTo(clickX, clickY);
        ctx.lineTo(CORRECT_X, CORRECT_Y);
        ctx.strokeStyle = "#ffaa33";
        ctx.lineWidth = 2;
        ctx.stroke();
    });
</script>
</body>
</html>

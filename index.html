<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turkey MapTap - Find the City</title>
    <style>
        * { user-select: none; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a472a, #0e2a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .game {
            background: #f5f2e8;
            border-radius: 30px;
            padding: 20px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .score-box {
            background: #2c2b28;
            padding: 8px 20px;
            border-radius: 50px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .target {
            background: #3b2a1f;
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-size: 1.3rem;
        }
        .city-name {
            color: #ffaa33;
            font-weight: bold;
            font-size: 1.8rem;
        }
        .map-container {
            text-align: center;
            margin: 15px 0;
        }
        canvas {
            display: inline-block;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: crosshair;
            background: #87CEEB;
            max-width: 100%;
            height: auto;
            border: 2px solid #c9b27c;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin: 15px 0 10px 0;
            justify-content: center;
        }
        button {
            background: #d9a13b;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            color: #2c2b28;
            min-width: 150px;
        }
        button:active { transform: scale(0.97); }
        #nextBtn { background: #2f6b3c; color: white; }
        #resetBtn { background: #8b6c3c; color: white; }
        .message {
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-size: 1.1rem;
            margin: 10px 0;
            font-weight: bold;
        }
        .message-info { background: #e8e0c8; color: #2c2b28; border: 2px solid #c9b27c; }
        .perfect { background: #a5d6a5; color: #1a472a; border: 2px solid #2f6b3c; }
        .good { background: #c8e6c8; color: #1a472a; border: 2px solid #4a8c3a; }
        .close { background: #ffe0b3; color: #5c3a1a; border: 2px solid #c9a13b; }
        .far { background: #ffcc99; color: #5c3a1a; border: 2px solid #b87a2a; }
        .miss { background: #ffb3b3; color: #8b0000; border: 2px solid #cc0000; }
        .game-complete { background: #a5d6a5; color: #1a472a; border: 3px solid #2f6b3c; font-size: 1.3rem; }
        .feedback {
            font-size: 0.9rem;
            margin-top: 8px;
            text-align: center;
            background: #e8e0c8;
            padding: 8px;
            border-radius: 30px;
            color: #2c2b28;
        }
        .progress {
            text-align: center;
            font-size: 1rem;
            margin-top: 10px;
            font-weight: bold;
            color: #2c2b28;
            background: #ddd0a8;
            padding: 8px;
            border-radius: 30px;
        }
        .final-score {
            text-align: center;
            font-size: 1.3rem;
            margin-top: 15px;
            padding: 15px;
            background: #2c2b28;
            border-radius: 20px;
            color: #ffd966;
        }
        .points-breakdown {
            background: #2c2b28;
            border-radius: 20px;
            padding: 10px 15px;
            margin-top: 10px;
            color: #ffd966;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .points-breakdown span { color: white; }
        .instruction {
            text-align: center;
            font-size: 0.9rem;
            color: #6b4c2c;
            margin-top: 5px;
        }
        @media (max-width: 700px) {
            .city-name { font-size: 1.3rem; }
            .target { font-size: 1rem; }
            button { padding: 8px 16px; min-width: 120px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="game">
    <div class="header">
        <div class="score-box">🏆 SCORE: <span id="score">0</span> / 1000</div>
        <div class="target">🎯 FIND: <span class="city-name" id="targetCity">Loading...</span></div>
    </div>
    
    <div class="map-container">
        <canvas id="turkeyCanvas" width="1024" height="500"></canvas>
    </div>
    
    <div class="button-group">
        <button id="resetBtn">🔄 PLAY AGAIN</button>
        <button id="nextBtn">➡️ NEXT CITY</button>
    </div>
    
    <div class="instruction">📍 Click on the map where you think the city is located</div>
    
    <div class="message message-info" id="message">Ready! Click on the map to start</div>
    <div class="feedback" id="feedback"></div>
    <div class="progress" id="progress">Question 1 of 5</div>
    
    <div class="points-breakdown">
        <div>🎯 0-60km: <span>200 pts</span></div>
        <div>👍 61-100km: <span>160 pts</span></div>
        <div>✅ 101-150km: <span>120 pts</span></div>
        <div>📌 151-200km: <span>80 pts</span></div>
        <div>🔍 201-300km: <span>40 pts</span></div>
        <div>❌ 300km+: <span>0 pts</span></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('turkeyCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1024;
    canvas.height = 500;
    
    const mapImage = new Image();
    mapImage.src = 'turkey-map.png';
    
    // City pixel positions - YOU CAN ADJUST THESE!
    // If a city appears in the sea, increase its Y value (move it DOWN)
    const cities = [
        { name: "Istanbul", x: 330, y: 180 },
        { name: "Ankara", x: 460, y: 240 },
        { name: "Izmir", x: 280, y: 300 },
        { name: "Bursa", x: 380, y: 220 },
        { name: "Antalya", x: 460, y: 390 },
        { name: "Adana", x: 540, y: 380 },
        { name: "Gaziantep", x: 600, y: 370 },
        { name: "Konya", x: 480, y: 320 },
        { name: "Trabzon", x: 690, y: 190 },
        { name: "Diyarbakır", x: 680, y: 350 },
        { name: "Mersin", x: 520, y: 400 },
        { name: "Kayseri", x: 560, y: 280 },
        { name: "Samsun", x: 620, y: 220 },
        { name: "Erzurum", x: 760, y: 250 },
        { name: "Van", x: 830, y: 330 },
        { name: "Malatya", x: 630, y: 310 },
        { name: "Denizli", x: 380, y: 350 },
        { name: "Şanlıurfa", x: 650, y: 380 },
        { name: "Eskişehir", x: 420, y: 240 },
        { name: "Edirne", x: 230, y: 170 }
    ];
    
    // Add all other cities here if needed
    
    let currentRound = [];
    let currentIndex = 0;
    let currentCity = null;
    let totalScore = 0;
    let canClick = true;
    let mapLoaded = false;
    let gameActive = true;
    let answered = false;
    let showMarkers = false;
    let clickPos = null;
    let correctPos = null;
    
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    function selectRandomCities() {
        return shuffleArray([...cities]).slice(0, 5);
    }
    
    function drawMap() {
        if (!mapLoaded) return;
        ctx.clearRect(0, 0, 1024, 500);
        ctx.drawImage(mapImage, 0, 0, 1024, 500);
        
        if (showMarkers) {
            // White circle - your click
            if (clickPos) {
                ctx.beginPath();
                ctx.arc(clickPos.x, clickPos.y, 12, 0, Math.PI * 2);
                ctx.fillStyle = "white";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(clickPos.x, clickPos.y, 12, 0, Math.PI * 2);
                ctx.strokeStyle = "black";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            // Green circle - correct location
            if (correctPos) {
                ctx.beginPath();
                ctx.arc(correctPos.x, correctPos.y, 14, 0, Math.PI * 2);
                ctx.fillStyle = "#33ff33";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(correctPos.x, correctPos.y, 14, 0, Math.PI * 2);
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Line between click and correct
                if (clickPos) {
                    ctx.beginPath();
                    ctx.moveTo(clickPos.x, clickPos.y);
                    ctx.lineTo(correctPos.x, correctPos.y);
                    ctx.strokeStyle = "#ffaa33";
                    ctx.lineWidth = 2;
                    ctx.setLineDash([8, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        }
    }
    
    mapImage.onload = () => { mapLoaded = true; drawMap(); };
    mapImage.onerror = () => { document.getElementById('message').innerHTML = "⚠️ Upload turkey-map.png to GitHub"; };
    
    function calculatePoints(distancePixels) {
        const km = distancePixels * 4.5;
        if (km <= 60) return 200;
        if (km <= 100) return 160;
        if (km <= 150) return 120;
        if (km <= 200) return 80;
        if (km <= 300) return 40;
        return 0;
    }
    
    function getGrade(distancePixels) {
        const km = distancePixels * 4.5;
        if (km <= 60) return "🎯 PERFECT!";
        if (km <= 100) return "👍 EXCELLENT!";
        if (km <= 150) return "✅ VERY GOOD!";
        if (km <= 200) return "📌 GOOD!";
        if (km <= 300) return "🔍 NOT BAD";
        return "❌ MISS";
    }
    
    function endGame() {
        gameActive = false;
        document.getElementById('message').className = "message game-complete";
        document.getElementById('message').innerHTML = `🎉 GAME COMPLETE! 🎉<br>⭐ Final Score: ${totalScore} / 1000 ⭐`;
        document.getElementById('nextBtn').style.display = "none";
        let finalDiv = document.getElementById('finalScore');
        if (!finalDiv) {
            finalDiv = document.createElement('div');
            finalDiv.id = 'finalScore';
            finalDiv.className = 'final-score';
            document.querySelector('.game').appendChild(finalDiv);
        }
        finalDiv.innerHTML = `🏆 FINAL SCORE: ${totalScore} / 1000 🏆`;
    }
    
    function loadNext() {
        if (currentIndex >= currentRound.length) { endGame(); return; }
        answered = false;
        showMarkers = false;
        clickPos = null;
        correctPos = null;
        currentCity = currentRound[currentIndex];
        document.getElementById('targetCity').innerText = currentCity.name;
        document.getElementById('progress').innerHTML = `📍 Question ${currentIndex + 1} of ${currentRound.length}`;
        document.getElementById('message').className = "message message-info";
        document.getElementById('message').innerHTML = "📍 CLICK ON THE MAP";
        document.getElementById('feedback').innerHTML = "";
        drawMap();
        canClick = true;
        document.getElementById('nextBtn').style.display = "block";
    }
    
    function handleClick(e) {
        if (!gameActive || !canClick || !currentCity || !mapLoaded || answered) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = 1024 / rect.width;
        const scaleY = 500 / rect.height;
        const userX = (e.clientX - rect.left) * scaleX;
        const userY = (e.clientY - rect.top) * scaleY;
        
        const dx = userX - currentCity.x;
        const dy = userY - currentCity.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const points = calculatePoints(dist);
        totalScore += points;
        
        document.getElementById('score').innerText = totalScore;
        const msgDiv = document.getElementById('message');
        let gradeClass = "miss";
        const km = dist * 4.5;
        if (km <= 60) gradeClass = "perfect";
        else if (km <= 150) gradeClass = "good";
        else if (km <= 300) gradeClass = "close";
        msgDiv.className = `message ${gradeClass}`;
        msgDiv.innerHTML = `${getGrade(dist)}<br>📍 ${Math.round(km)} km from ${currentCity.name}<br>⭐ +${points} pts`;
        document.getElementById('feedback').innerHTML = `You clicked ${Math.round(km)} km away`;
        
        showMarkers = true;
        clickPos = { x: userX, y: userY };
        correctPos = { x: currentCity.x, y: currentCity.y };
        drawMap();
        answered = true;
        canClick = false;
    }
    
    function nextCity() {
        if (!gameActive) return;
        if (!answered) {
            document.getElementById('message').innerHTML = "⚠️ Click on the map first!";
            return;
        }
        currentIndex++;
        loadNext();
    }
    
    function resetGame() {
        gameActive = true;
        totalScore = 0;
        currentIndex = 0;
        answered = false;
        showMarkers = false;
        document.getElementById('score').innerText = "0";
        document.getElementById('nextBtn').style.display = "block";
        const finalDiv = document.getElementById('finalScore');
        if (finalDiv) finalDiv.remove();
        currentRound = selectRandomCities();
        loadNext();
    }
    
    resetGame();
    canvas.addEventListener('click', handleClick);
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    document.getElementById('nextBtn').addEventListener('click', nextCity);
</script>
</body>
</html>

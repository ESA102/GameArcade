<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turkey MapTap - Find the City</title>
    <style>
        * { user-select: none; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1a472a, #0e2a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .game {
            background: #f5f2e8;
            border-radius: 30px;
            padding: 20px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .score-box {
            background: #2c2b28;
            padding: 8px 20px;
            border-radius: 50px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .target {
            background: #3b2a1f;
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-size: 1.3rem;
        }
        .city-name {
            color: #ffaa33;
            font-weight: bold;
            font-size: 1.8rem;
        }
        .map-container {
            text-align: center;
            margin: 15px 0;
        }
        canvas {
            display: inline-block;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: crosshair;
            background: #87CEEB;
            max-width: 100%;
            height: auto;
            border: 2px solid #c9b27c;
        }
        .message {
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-size: 1.1rem;
            margin: 10px 0;
            font-weight: bold;
        }
        .message-info { background: #e8e0c8; color: #2c2b28; border: 2px solid #c9b27c; }
        .perfect { background: #a5d6a5; color: #1a472a; border: 2px solid #2f6b3c; }
        .good { background: #c8e6c8; color: #1a472a; border: 2px solid #4a8c3a; }
        .close { background: #ffe0b3; color: #5c3a1a; border: 2px solid #c9a13b; }
        .far { background: #ffcc99; color: #5c3a1a; border: 2px solid #b87a2a; }
        .miss { background: #ffb3b3; color: #8b0000; border: 2px solid #cc0000; }
        .game-complete { background: #a5d6a5; color: #1a472a; border: 3px solid #2f6b3c; font-size: 1.3rem; }
        .feedback {
            font-size: 0.9rem;
            margin-top: 8px;
            text-align: center;
            background: #e8e0c8;
            padding: 8px;
            border-radius: 30px;
            color: #2c2b28;
        }
        .progress {
            text-align: center;
            font-size: 1rem;
            margin-top: 10px;
            font-weight: bold;
            color: #2c2b28;
            background: #ddd0a8;
            padding: 8px;
            border-radius: 30px;
        }
        .final-score {
            text-align: center;
            font-size: 1.3rem;
            margin-top: 15px;
            padding: 15px;
            background: #2c2b28;
            border-radius: 20px;
            color: #ffd966;
        }
        button {
            background: #d9a13b;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            color: #2c2b28;
        }
        button:active { transform: scale(0.98); }
        .points-breakdown {
            background: #2c2b28;
            border-radius: 20px;
            padding: 10px 15px;
            margin-top: 10px;
            color: #ffd966;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .points-breakdown span { color: white; }
        @media (max-width: 700px) {
            .city-name { font-size: 1.3rem; }
            .target { font-size: 1rem; }
            .points-breakdown { font-size: 0.7rem; gap: 8px; }
        }
    </style>
</head>
<body>
<div class="game">
    <div class="header">
        <div class="score-box">🏆 SCORE: <span id="score">0</span> / 1000</div>
        <div class="target">🎯 FIND: <span class="city-name" id="targetCity">Loading...</span></div>
    </div>
    
    <div class="map-container">
        <canvas id="turkeyCanvas" width="1024" height="500"></canvas>
    </div>
    
    <div class="message message-info" id="message">📍 CLICK ON THE MAP where you think the city is located</div>
    <div class="feedback" id="feedback"></div>
    <div class="progress" id="progress">Question 1 of 5</div>
    
    <div class="points-breakdown">
        <div>🎯 0-60km: <span>200 pts</span></div>
        <div>👍 61-100km: <span>160 pts</span></div>
        <div>✅ 101-150km: <span>120 pts</span></div>
        <div>📌 151-200km: <span>80 pts</span></div>
        <div>🔍 201-300km: <span>40 pts</span></div>
        <div>❌ 300km+: <span>0 pts</span></div>
    </div>
    
    <button id="resetBtn">🔄 PLAY AGAIN</button>
</div>

<script>
    const canvas = document.getElementById('turkeyCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = 1024;
    canvas.height = 500;
    
    const mapImage = new Image();
    mapImage.src = 'turkey-map.png';
    
    const TURKEY_NORTH = 42.106;
    const TURKEY_SOUTH = 35.813;
    const TURKEY_WEST = 25.666;
    const TURKEY_EAST = 44.818;
    
    function latToY(lat) {
        return ((TURKEY_NORTH - lat) / (TURKEY_NORTH - TURKEY_SOUTH)) * 500;
    }
    
    function lonToX(lon) {
        return ((lon - TURKEY_WEST) / (TURKEY_EAST - TURKEY_WEST)) * 1024;
    }
    
    function haversineDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    
    const allCities = [
        { name: "Istanbul", lat: 41.0082, lon: 28.9784 },
        { name: "Ankara", lat: 39.9208, lon: 32.8541 },
        { name: "Izmir", lat: 38.4189, lon: 27.1287 },
        { name: "Antalya", lat: 36.8969, lon: 30.7133 },
        { name: "Adana", lat: 36.9919, lon: 35.3308 },
        { name: "Bursa", lat: 40.1826, lon: 29.0665 },
        { name: "Gaziantep", lat: 37.0662, lon: 37.3833 },
        { name: "Konya", lat: 37.8704, lon: 32.5110 },
        { name: "Trabzon", lat: 41.0061, lon: 39.7191 },
        { name: "Diyarbakır", lat: 37.9144, lon: 40.2306 },
        { name: "Mersin", lat: 36.8000, lon: 34.6333 },
        { name: "Kayseri", lat: 38.7239, lon: 35.4801 },
        { name: "Samsun", lat: 41.2871, lon: 36.3234 },
        { name: "Erzurum", lat: 39.9051, lon: 41.2709 },
        { name: "Van", lat: 38.5012, lon: 43.3730 },
        { name: "Malatya", lat: 38.3552, lon: 38.3095 },
        { name: "Denizli", lat: 37.7735, lon: 29.0865 },
        { name: "Şanlıurfa", lat: 37.1591, lon: 38.7969 },
        { name: "Eskişehir", lat: 39.7700, lon: 30.5025 },
        { name: "Edirne", lat: 41.6771, lon: 26.5557 }
    ];
    
    const cities = allCities.map(city => ({
        name: city.name,
        lat: city.lat,
        lon: city.lon,
        x: lonToX(city.lon),
        y: latToY(city.lat)
    }));
    
    let currentRound = [];
    let currentQuestionIndex = 0;
    let currentCity = null;
    let totalScore = 0;
    let canClick = true;
    let mapLoaded = false;
    let gameActive = true;
    let nextTimeout = null;
    let answered = false;
    
    // Marker variables
    let showUserMarker = false;
    let userX = null, userY = null;
    let showCorrectMarker = false;
    let correctX = null, correctY = null;
    
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    function selectRandomCities() {
        const shuffled = shuffleArray([...cities]);
        return shuffled.slice(0, 5);
    }
    
    function drawMap() {
        if (!mapLoaded) return;
        
        ctx.clearRect(0, 0, 1024, 500);
        ctx.drawImage(mapImage, 0, 0, 1024, 500);
        
        // Draw user's click marker (WHITE)
        if (showUserMarker && userX && userY) {
            ctx.beginPath();
            ctx.arc(userX, userY, 14, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(userX, userY, 14, 0, Math.PI * 2);
            ctx.strokeStyle = "black";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.font = "bold 12px Arial";
            ctx.fillStyle = "white";
            ctx.shadowBlur = 3;
            ctx.shadowColor = "black";
            ctx.fillText("👆 YOUR CLICK", userX + 12, userY - 8);
            ctx.shadowBlur = 0;
        }
        
        // Draw correct location marker (GREEN)
        if (showCorrectMarker && correctX && correctY) {
            ctx.beginPath();
            ctx.arc(correctX, correctY, 18, 0, Math.PI * 2);
            ctx.fillStyle = "#33ff33";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(correctX, correctY, 18, 0, Math.PI * 2);
            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.font = "bold 12px Arial";
            ctx.fillStyle = "#33ff33";
            ctx.shadowBlur = 3;
            ctx.shadowColor = "black";
            ctx.fillText(`✅ CORRECT: ${currentCity.name}`, correctX + 12, correctY - 10);
            ctx.shadowBlur = 0;
        }
        
        // Draw line between user click and correct location
        if (showUserMarker && showCorrectMarker && userX && userY && correctX && correctY) {
            ctx.beginPath();
            ctx.moveTo(userX, userY);
            ctx.lineTo(correctX, correctY);
            ctx.strokeStyle = "#ffaa33";
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }
    
    mapImage.onload = function() {
        mapLoaded = true;
        drawMap();
    };
    
    function calculatePoints(distanceKm) {
        if (distanceKm <= 60) return 200;
        if (distanceKm <= 100) return 160;
        if (distanceKm <= 150) return 120;
        if (distanceKm <= 200) return 80;
        if (distanceKm <= 300) return 40;
        return 0;
    }
    
    function getGradeText(distanceKm) {
        if (distanceKm <= 60) return "🎯 PERFECT!";
        if (distanceKm <= 100) return "👍 EXCELLENT!";
        if (distanceKm <= 150) return "✅ VERY GOOD!";
        if (distanceKm <= 200) return "📌 GOOD!";
        if (distanceKm <= 300) return "🔍 NOT BAD";
        return "❌ MISS";
    }
    
    function endGame() {
        gameActive = false;
        const msgDiv = document.getElementById('message');
        msgDiv.className = "message game-complete";
        msgDiv.innerHTML = `🎉 GAME COMPLETE! 🎉<br>⭐ Final Score: ${totalScore} / 1000 ⭐`;
        document.getElementById('progress').innerHTML = `🏁 Game finished! Click "PLAY AGAIN"`;
        
        let finalDiv = document.getElementById('finalScore');
        if (!finalDiv) {
            finalDiv = document.createElement('div');
            finalDiv.id = 'finalScore';
            finalDiv.className = 'final-score';
            document.querySelector('.game').appendChild(finalDiv);
        }
        finalDiv.innerHTML = `🏆 FINAL SCORE: ${totalScore} / 1000 🏆`;
    }
    
    function loadNextQuestion() {
        if (currentQuestionIndex >= currentRound.length) {
            endGame();
            return;
        }
        
        answered = false;
        showUserMarker = false;
        showCorrectMarker = false;
        userX = null;
        userY = null;
        correctX = null;
        correctY = null;
        
        currentCity = currentRound[currentQuestionIndex];
        document.getElementById('targetCity').innerText = currentCity.name;
        document.getElementById('progress').innerHTML = `📍 Question ${currentQuestionIndex + 1} of ${currentRound.length}`;
        document.getElementById('message').className = "message message-info";
        document.getElementById('message').innerHTML = "📍 CLICK ON THE MAP where you think the city is located";
        document.getElementById('feedback').innerHTML = "";
        drawMap();
        canClick = true;
    }
    
    function handleCanvasClick(e) {
        if (!gameActive || !canClick || !currentCity || !mapLoaded || answered) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;
        
        // Calculate distance
        const dx = clickX - currentCity.x;
        const dy = clickY - currentCity.y;
        const pixelDist = Math.sqrt(dx * dx + dy * dy);
        const distanceKm = Math.round(pixelDist * 5);
        
        const points = calculatePoints(distanceKm);
        totalScore += points;
        
        document.getElementById('score').innerText = totalScore;
        
        const msgDiv = document.getElementById('message');
        let gradeClass = "miss";
        if (distanceKm <= 60) gradeClass = "perfect";
        else if (distanceKm <= 100) gradeClass = "perfect";
        else if (distanceKm <= 150) gradeClass = "good";
        else if (distanceKm <= 200) gradeClass = "good";
        else if (distanceKm <= 300) gradeClass = "close";
        
        msgDiv.className = `message ${gradeClass}`;
        msgDiv.innerHTML = `${getGradeText(distanceKm)}<br>📍 ${distanceKm} km from ${currentCity.name}<br>⭐ +${points} points!`;
        document.getElementById('feedback').innerHTML = `You clicked ${distanceKm} km away from ${currentCity.name}`;
        
        // SET THE MARKERS
        showUserMarker = true;
        userX = clickX;
        userY = clickY;
        showCorrectMarker = true;
        correctX = currentCity.x;
        correctY = currentCity.y;
        
        drawMap();
        
        answered = true;
        canClick = false;
        
        if (nextTimeout) clearTimeout(nextTimeout);
        nextTimeout = setTimeout(() => {
            currentQuestionIndex++;
            loadNextQuestion();
        }, 4000);
    }
    
    function resetGame() {
        if (nextTimeout) clearTimeout(nextTimeout);
        gameActive = true;
        totalScore = 0;
        currentQuestionIndex = 0;
        answered = false;
        showUserMarker = false;
        showCorrectMarker = false;
        document.getElementById('score').innerText = "0";
        const finalDiv = document.getElementById('finalScore');
        if (finalDiv) finalDiv.remove();
        currentRound = selectRandomCities();
        loadNextQuestion();
    }
    
    resetGame();
    canvas.addEventListener('click', handleCanvasClick);
    document.getElementById('resetBtn').addEventListener('click', resetGame);
</script>
</body>
</html>

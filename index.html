<!DOCTYPE html>
<html>
<head>
    <title>TEST - Show Green Dot</title>
    <style>
        body { background: #1a472a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        canvas { border: 5px solid white; background: #c9b27c; cursor: crosshair; }
    </style>
</head>
<body>
<canvas id="myCanvas" width="800" height="500"></canvas>

<script>
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    
    // Draw a simple map (gray shape)
    ctx.fillStyle = "#c9b27c";
    ctx.fillRect(0, 0, 800, 500);
    
    // Draw a red dot at position 400, 250 (center)
    ctx.beginPath();
    ctx.arc(400, 250, 15, 0, Math.PI * 2);
    ctx.fillStyle = "red";
    ctx.fill();
    ctx.fillStyle = "white";
    ctx.font = "bold 16px Arial";
    ctx.fillText("CORRECT LOCATION (RED DOT)", 400, 220);
    
    // When you click ANYWHERE, a GREEN dot appears at the SAME red dot location
    canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        
        // Draw a green circle at the CORRECT location (400, 250)
        ctx.beginPath();
        ctx.arc(400, 250, 20, 0, Math.PI * 2);
        ctx.fillStyle = "#33ff33";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(400, 250, 20, 0, Math.PI * 2);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Show where you clicked
        ctx.beginPath();
        ctx.arc(x, y, 12, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
        
        ctx.fillStyle = "black";
        ctx.font = "14px Arial";
        ctx.fillText("YOU CLICKED HERE", x + 10, y - 5);
        ctx.fillStyle = "#33ff33";
        ctx.fillText("✅ CORRECT LOCATION", 400, 220);
    });
</script>
</body>
</html>
